name: Version consistency

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository and runtime versions
        shell: pwsh
        run: ./tools/check-version.ps1
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = '${{ github.ref_name }}' -replace '^v', ''
          ./tools/check-version.ps1 -ExpectedVersion $expected